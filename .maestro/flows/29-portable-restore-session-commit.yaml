appId: com.nalves.dndcombatmathmvp
name: Confirmar sessão portátil coordenada
---
- launchApp
- openLink: dndcombatmath://e2e-seed
- tapOn:
    id: e2e-seed-restore-session-commit
- assertVisible: "Cenário E2E de sessão portátil commit preparado."
- tapOn:
    id: e2e-open-restore-session
- assertVisible: "Restauração confirmada"
- assertVisible: "O checkpoint está persistido e verificável."
