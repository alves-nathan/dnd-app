appId: com.nalves.dndcombatmathmvp
name: Corrigir divergência e gerar recibo
---
- launchApp
- openLink: dndcombatmath://e2e-seed
- tapOn:
    id: e2e-seed-restore-verification-corrected
- assertVisible: "Cenário E2E de verificação pós-restauração corrected preparado."
- tapOn:
    id: e2e-open-restore-session
- assertVisible: "Integridade aprovada"
- assertVisible: "Recibo:"
