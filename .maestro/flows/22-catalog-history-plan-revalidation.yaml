appId: com.nalves.dndcombatmathmvp
name: Revalidar planos preventivos durante restauração
---
- launchApp
- openLink: dndcombatmath://e2e-seed
- tapOn:
    id: e2e-seed-catalog-history
- assertVisible: "Cenário E2E de histórico transacional do catálogo preparado."
- openLink: dndcombatmath://catalog-history
- tapOn: "Restaurar configuração anterior"
- assertVisible:
    id: catalog-history-plan-reconciliation
- tapOn:
    id: catalog-impact-apply
- openLink: dndcombatmath://catalog-history
- assertVisible: "Planos preventivos reconciliados: 1 removido(s)"
