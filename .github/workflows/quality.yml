name: Quality

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run release:validate
      - run: npm run benchmark:synthetic
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: quality-failure-${{ github.run_id }}
          path: |
            coverage
            npm-debug.log
          if-no-files-found: ignore
          retention-days: 14
